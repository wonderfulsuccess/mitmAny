name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: gitleaks git --redact --log-opts="--all" .
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/check-release.mjs
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'macOS'
        run: go test -race ./...
      - run: go mod download
      - run: node scripts/collect-licenses.mjs
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - if: runner.os == 'macOS'
        run: wails build -clean -platform darwin/universal -trimpath
      - if: runner.os == 'Windows'
        run: wails build -clean -platform windows/amd64 -trimpath
      - name: Sign and notarize macOS release if configured
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/sign-macos.sh build/bin/mitmAny.app build/notices/SIGNING.txt
      - name: Sign Windows release if configured
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Executable build/bin/mitmAny.exe -StatusPath build/notices/SIGNING.txt
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION=$(node -p "require('./wails.json').info.productVersion")
          mkdir -p build/package build/artifacts
          cp -R build/bin/mitmAny.app build/package/
          node scripts/package-notices.mjs build/package
          if [ -f build/notices/SIGNING.txt ]; then cp build/notices/SIGNING.txt build/package/; else echo 'macOS: unsigned CI development build.' > build/package/SIGNING.txt; fi
          cp build/package/SIGNING.txt build/artifacts/SIGNING-macOS.txt
          ditto -c -k --sequesterRsrc build/package "build/artifacts/mitmAny-$VERSION-macos-universal.zip"
          unzip -tq "build/artifacts/mitmAny-$VERSION-macos-universal.zip"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content wails.json | ConvertFrom-Json).info.productVersion
          New-Item -ItemType Directory -Force build/package,build/artifacts | Out-Null
          Copy-Item build/bin/mitmAny.exe build/package/
          node scripts/package-notices.mjs build/package
          if ($LASTEXITCODE -ne 0) { throw "Documentation packaging failed." }
          if (Test-Path build/notices/SIGNING.txt) { Copy-Item build/notices/SIGNING.txt build/package/ } else { 'Windows: unsigned CI development build.' | Set-Content build/package/SIGNING.txt }
          Copy-Item build/package/SIGNING.txt build/artifacts/SIGNING-Windows.txt
          Compress-Archive -Path build/package/* -DestinationPath "build/artifacts/mitmAny-$version-windows-amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mitmAny-${{ runner.os }}
          path: build/artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mitmAny-*
          path: release
          merge-multiple: true
      - name: Create draft with checksums and signing status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            cat "docs/releases/$RELEASE_TAG.md" > release-notes.md
          else
            cat docs/release-notes-template.md > release-notes.md
          fi
          printf '\nBuild signing status:\n\n' >> release-notes.md
          cat release/SIGNING-*.txt >> release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "mitmAny $RELEASE_TAG" --notes-file release-notes.md
