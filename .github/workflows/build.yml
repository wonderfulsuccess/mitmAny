name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'macOS'
        run: go test -race ./...
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - if: runner.os == 'macOS'
        run: wails build -clean -platform darwin/universal
      - if: runner.os == 'Windows'
        run: wails build -clean
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/bin/mitmAny.app build/bin/mitmAny-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mitmAny-${{ runner.os }}
          path: |
            build/bin/*.zip
            build/bin/*.exe
