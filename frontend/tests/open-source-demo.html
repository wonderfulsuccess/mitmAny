<html lang="zh-CN"><head><meta charset="UTF-8"><title>mitmAny · Synthetic demo</title></head>
<body><div id="root"></div><script type="module">
// Public, synthetic UI fixture. Every native operation below is mocked.
const params = new URLSearchParams(location.search);

 ['GET','api.example.test','/v1/projects',200,{projects:[{id:'demo-01',name:'Open source launch',status:'active'},{id:'demo-02',name:'Android inspection',status:'active'}],pagination:{page:1,next_page:2,total:24}},132],

 ['GET','api.example.test','/v1/notifications',200,{items:[],unread:0},71],

 ['GET','docs.example.test','/guide',200,{title:'Getting started'},110],
 ['GET','api.example.test','/v1/health',200,{status:'ok'},12]

 const text=JSON.stringify(body,null,2);
 return {...base,id:'demo-'+i,method,host,domain:host,rootDomain:'example.test',path,url:'https://'+host+path,status,started:Date.now()-(rows.length-i)*1200,duration,ttfb:duration/2,responseSize:text.length,responseCaptured:text.length,responseBody:btoa(text)};
});

 SetLanguage:async()=>{},
 GetState:async()=>({...state}), GetCertificateStatus:async()=>{if(scenario==='check-error') throw new Error('Synthetic certificate check failed'); return {...cert};}, GetAndroidState:async()=>({...phone}),
