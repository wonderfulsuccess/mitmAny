<!doctype html><html><head><meta charset="UTF-8"><title>Responsive request inspector</title></head><body style="margin:0;background:#dce2e6;font:12px system-ui"><nav style="height:36px;display:flex;gap:8px;align-items:center;padding:0 8px">预览 <button onclick="size(480)">480</button><button onclick="size(720)">720</button><button onclick="size(1000)">1000</button><button onclick="size(1440)">1440</button><button onclick="report()">检查</button><button onclick="document.querySelector('iframe').contentWindow.postMessage('append-preview-request',location.origin)">新增</button></nav><iframe title="mitmAny 响应式预览" src="request-menu-preview.html?live=1" style="border:0;width:480px;height:900px;display:block;transform-origin:top left"></iframe><output style="position:fixed;bottom:0;right:0;max-width:100%;background:#fff;white-space:pre-wrap;pointer-events:none;font-size:10px"></output><script>
function size(w){const f=document.querySelector('iframe');f.style.width=w+'px';f.style.transform='scale('+Math.min(1,(innerWidth-8)/w)+')';}
function report(){const d=document.querySelector('iframe').contentDocument;const rect=s=>d.querySelector(s)?.getBoundingClientRect().toJSON();const menu=d.querySelector('[role=menu]');document.querySelector('output').textContent=JSON.stringify({width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,list:rect('.traffic-panel'),detail:rect('.inspector'),split:rect('.resize-handle'),scroll:(()=>{const el=d.querySelector('.table-scroll');return el?{top:el.scrollTop,height:el.scrollHeight,viewport:el.clientHeight}:null})(),menu:menu?{rect:rect('[role=menu]'),align:d.defaultView.getComputedStyle(menu.querySelector('button')).justifyContent}:null},null,1);}
if(new URLSearchParams(location.search).has('static')) document.querySelector('iframe').src='request-menu-preview.html';
size(480);
</script></body></html>
